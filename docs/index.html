<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">Meus Stickers - Monopoly GO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-i18n="heading">🎲 Meus Stickers</h1>
    <p class="subtitle" id="subtitle">Monopoly GO</p>
    <div class="lang-toggle">
      <button class="lang-btn active" data-lang="pt" title="Português">🇧🇷</button>
      <button class="lang-btn" data-lang="en" title="English">🇺🇸</button>
    </div>
    <p class="header-date"><span data-i18n="footer">Atualizado em:</span> <span id="atualizado-em">—</span></p>
  </header>

  <main>
    <section class="progresso" id="progresso">
      <div class="stats" id="stats">
        <strong id="stat-tenho">0</strong> <span data-i18n="stat-tenho">tenho</span> ·
        <strong id="stat-falta">0</strong> <span data-i18n="stat-falta">faltando</span> ·
        <strong id="stat-dup">0</strong> <span data-i18n="stat-dup">duplicatas</span>
      </div>
      <div class="barra-container">
        <div class="barra" id="barra-progresso"></div>
      </div>
    </section>

    <section class="filtros">
      <input type="text" id="busca" data-i18n-placeholder="busca-placeholder" placeholder="Buscar sticker...">
      <select id="filtro-set">
        <option value="" data-i18n="filtro-set-all">Todos os sets</option>
      </select>
      <select id="filtro-status">
        <option value="" data-i18n="filtro-status-all">Todos os status</option>
        <option value="tenho" data-i18n="filtro-status-tenho">Tenho</option>
        <option value="falta" data-i18n="filtro-status-falta">Faltando</option>
        <option value="duplicata" data-i18n="filtro-status-dup">Duplicatas</option>
      </select>
    </section>

    <section class="album" id="album"></section>
  </main>

  <footer></footer>

  <script src="app.js"></script>
</body>
</html>
